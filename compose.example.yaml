services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medici
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -d postgres://postgres:postgres@db:5432/medici -c 'SELECT 1;' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medici:
    image: mrkaye97/medici:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/medici
      # Generate with `openssl rand -base64 48`. Anyone who knows it can log
      # in as any user.
      AUTH_SECRET_KEY: change-me-in-production
      # Optional: email password reset links. See the README.
      # APP_URL: https://medici.example.com
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_USERNAME: you@gmail.com
      # SMTP_PASSWORD: your-app-password
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
