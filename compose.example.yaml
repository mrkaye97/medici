services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medici
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -d postgres://postgres:postgres@db:5432/medici -c 'SELECT 1;' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  medici:
    image: mrkaye97/medici:latest
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/medici
      AUTH_SECRET_KEY: change-me-in-production
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
